      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.05) 0%, transparent 10%);
        background-size: 50px 50px;
        z-index: -1;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: #020617;
        color: #f8fafc;
        min-height: 100vh;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .input-style {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }
      .input-style:focus {
        border-color: #22d3ee;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
      }
      .card-container {
        perspective: 1500px;
      }
      .card-inner {
        transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        transform-style: preserve-3d;
      }
      .card-flipped {
        transform: rotateY(180deg);
      }
      .card-face {
        backface-visibility: hidden;
        position: absolute;
        inset: 0;
      }
      .card-back {
        transform: rotateY(180deg);
      }
      .fade-up {
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      .btn-gradient {
        background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
        transition: all 0.4s ease;
      }
      .btn-gradient:hover {
        box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
        transform: translateY(-2px);
      }

        color: #e2e8f0;

        left: 0;
        color: #22d3ee;
        font-size: 0.9em;
      }

        list-style: none;
        counter-reset: list-counter;
        padding-left: 0;
        margin: 1rem 0;
      }

        counter-increment: list-counter;
        position: relative;
        padding-left: 2.2rem;
        margin-bottom: 0.75rem;
        color: #e2e8f0;
      }
      #aiMarkdownOutput ol li::before {
        content: counter(list-counter) ".";
        position: absolute;
        left: 0;
        color: #22d3ee;
        font-weight: 600;
        min-width: 1.8rem;
      }
      #aiMarkdownOutput blockquote {
        border-left: 3px solid #22d3ee;
        padding-left: 1.5rem;
        margin: 1.5rem 0;
        color: #94a3b8;
        font-style: italic;
        background: rgba(34, 211, 238, 0.05);
        padding: 1.5rem;
        border-radius: 0.75rem;
      }
      #aiMarkdownOutput code {
        background: rgba(15, 23, 42, 0.7);

        font-size: 0.9em;
      }

        background: rgba(15, 23, 42, 0.8);

        margin: 1.5rem 0;

      }
      #aiMarkdownOutput pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }
      #aiMarkdownOutput table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      #aiMarkdownOutput th {
        background: rgba(34, 211, 238, 0.1);
        color: #22d3ee;

        padding: 0.75rem 1rem;
        text-align: left;

      #aiMarkdownOutput td {

      #aiMarkdownOutput tr:last-child td {

      }
      #aiMarkdownOutput hr {

        background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.3), transparent);
        margin: 2rem 0;
      }
      #aiMarkdownOutput a {
        color: #38bdf8;
        text-decoration: none;

        transition: all 0.2s ease;
      }
      #aiMarkdownOutput a:hover {
        color: #22d3ee;
        border-bottom: 1px solid rgba(34, 211, 238, 0.5);
      }

        background: linear-gradient(120deg, rgba(34, 211, 238, 0.2) 0%, rgba(34, 211, 238, 0.1) 100%);

        border-radius: 0.25rem;

      #aiMarkdownOutput .note,

        background: rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(34, 211, 238, 0.2);
        padding: 1.5rem;
        border-radius: 1rem;
        margin: 1.5rem 0;
      }
      #aiMarkdownOutput sub,
      #aiMarkdownOutput sup {
        font-size: 0.75em;
        line-height: 0;
        position: relative;

      }

      }
      #aiMarkdownOutput sub {
        bottom: -0.25em;
      }

        margin: 1rem 0;

        { id: 74, en: "Page of Pentacles", vi: "Thằng Bé Tiền", upright: "Học hỏi, cơ hội mới, thực tế", reversed: "Thiếu tham vọng, lãng phí cơ hội, thiếu thực tế" },
        { id: 75, en: "Knight of Pentacles", vi: "Kỵ Sĩ Tiền", upright: "Chăm chỉ, đáng tin cậy, kiên trì", reversed: "Lười biếng, cứng nhắc, thiếu tiến bộ" },

        { id: 77, en: "King of Pentacles", vi: "Vua Tiền", upright: "Thịnh vượng, thành công vật chất, lãnh đạo", reversed: "Tham lam, thiếu đạo đức, mất tài sản" },
      ];

      let historyAllowed = localStorage.getItem("aetheris_consent") === "true";
      let currentSessionData = null;

      window.onload = () => {
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) document.getElementById("apiKey").value = savedKey;
        loadPreferences();
        renderHistory();
      };

      function savePreferences() {
        const prefs = {
          username: document.getElementById("username").value,
          numCards: document.getElementById("numCards").value,
          model: document.getElementById("modelSelect").value,
        };
        localStorage.setItem("aetheris_prefs", JSON.stringify(prefs));
      }

      function loadPreferences() {
        const savedPrefs = localStorage.getItem("aetheris_prefs");
        if (savedPrefs) {
          const prefs = JSON.parse(savedPrefs);
          if (prefs.username) document.getElementById("username").value = prefs.username;
          if (prefs.numCards) document.getElementById("numCards").value = prefs.numCards;
          if (prefs.model) document.getElementById("modelSelect").value = prefs.model;
        }
      }

      async function typeWriter(text, element) {
        const parsedHTML = marked.parse(text);
        element.innerHTML = parsedHTML;
        element.classList.add("fade-up");
      }

      async function renderSession(data) {
        currentSessionData = data;
        const area = document.getElementById("readingArea");
        const grid = document.getElementById("cardsGrid");
        const aiArea = document.getElementById("aiResponseArea");
        const aiOutput = document.getElementById("aiMarkdownOutput");
        const apiKey = document.getElementById("apiKey").value;
        const modelName = document.getElementById("modelSelect").value;

        area.classList.remove("hidden");
        grid.innerHTML = "";
        aiArea.classList.add("hidden");
        aiArea.style.opacity = "0";

        document.getElementById("displayUserName").innerText = data.name;
        document.getElementById("displayQuestion").innerText = `“${data.question}”`;

        for (let i = 0; i < data.cards.length; i++) {
          const card = data.cards[i];
          const cardUI = document.createElement("div");
          cardUI.className = "card-container fade-up w-[260px] h-[400px]";
          const statusClass = card.isRev ? "text-rose-400" : "text-cyan-400";
          cardUI.innerHTML = `
            <div class="card-inner relative w-full h-full shadow-2xl rounded-[2.5rem] cursor-pointer">
              <div class="card-face card-front glass-panel rounded-[2.5rem] flex items-center justify-center border-white/10">
                <div class="w-12 h-12 rounded-full border border-cyan-500/20 flex items-center justify-center relative"><div class="absolute inset-0 rounded-full bg-cyan-500/5 animate-ping"></div><div class="w-2 h-2 bg-cyan-500 rounded-full"></div></div>
              </div>
              <div class="card-face card-back glass-panel rounded-[2.5rem] p-8 flex flex-col items-center border-cyan-500/40">
                <div class="text-[9px] font-bold text-slate-500 tracking-widest uppercase mb-auto">Arcana ${i + 1}</div>
                <div class="flex-grow flex flex-col items-center justify-center text-center">
                  <div class="text-2xl font-bold text-white ${card.isRev ? "rotate-180" : ""}">${card.vi}</div>
                  <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-6">${card.en}</div>
                  <p class="text-[11px] text-slate-300 leading-relaxed line-clamp-6">${card.isRev ? card.reversed : card.upright}</p>
                </div>
                <div class="mt-auto pt-4 text-[9px] font-black uppercase ${statusClass}">${card.isRev ? "• Ngược •" : "• Xuôi •"}</div>
              </div>
            </div>`;
          grid.appendChild(cardUI);
          await new Promise((r) => setTimeout(r, 200));
          cardUI.querySelector(".card-inner").classList.add("card-flipped");
        }

        if (data.aiContent) {
          aiArea.classList.remove("hidden");
          aiOutput.innerHTML = marked.parse(data.aiContent);
          setTimeout(() => (aiArea.style.opacity = "1"), 100);
          return;
        }

        if (apiKey) {
          aiArea.classList.remove("hidden");
          aiOutput.innerHTML = `<div class="py-12 text-center text-xs text-cyan-500 animate-pulse uppercase tracking-widest">Đang kết nối tinh tú...</div>`;
          setTimeout(() => (aiArea.style.opacity = "1"), 100);

          try {
            const genAI = new GoogleGenerativeAI(apiKey);
            const model = genAI.getGenerativeModel({ model: modelName });
            const cardsInfo = data.cards.map((c) => `${c.en} (${c.isRev ? "Ngược" : "Xuôi"})`).join(", ");
            const finalPrompt = `Đóng vai Tarot chuyên nghiệp, giải mã phiên của: ${data.name}
             Câu hỏi: "${data.question}"
             Các lá bài đã rút: ${cardsInfo}

             YÊU CẦU PHÂN TÍCH:

             1. Đóng vai một Tarot Reader chuyên nghiệp
             2. Phân tích CHI TIẾT từng lá bài:
                - Ý nghĩa cơ bản của lá bài (cả xuôi/ngược)
                - Ý nghĩa của lá bài trong ngữ cảnh câu hỏi cụ thể
                - Mối liên hệ giữa lá bài với tình huống được hỏi

             3. Phân tích tổng thể:
                - Mối quan hệ giữa các lá bài với nhau
                - Câu chuyện tổng thể mà bộ bài kể ra
                - Thông điệp chính từ bộ bài

             4. Đưa ra kết luận:
                - Dựa HOÀN TOÀN vào ý nghĩa của các lá bài
                - Không thêm thắt, không vẽ chuyện
                - Trung thực, khách quan
                - Cụ thể và chi tiết
                - Kết nối trực tiếp với câu hỏi ban đầu

             LƯU Ý QUAN TRỌNG:
             - Chỉ phân tích dựa trên các lá bài đã rút và câu hỏi
             - Không thêm thông tin ngoài hay suy diễn cá nhân
             - Giữ tính chính xác và trung thực của Tarot
             - Đưa ra cái nhìn sâu sắc nhưng không tiên đoán tương lai tuyệt đối
             - Tập trung vào hướng dẫn, bài học và nhận thức`;

            const result = await model.generateContent(finalPrompt);
            const response = await result.response;
            const text = response.text();

            await typeWriter(text, aiOutput);

            updateHistoryAndSave(data, text);
            currentSessionData.aiContent = text;
          } catch (e) {
            aiOutput.innerHTML = `<p class="text-rose-500 text-xs">Lỗi: ${e.message}</p>`;
          }
        }
      }

      function updateHistoryAndSave(session, content) {
        session.aiContent = content;
        let h = JSON.parse(localStorage.getItem("aetheris_history") || "[]");
        const idx = h.findIndex((s) => s.id === session.id);
        if (idx !== -1) {
          h[idx].aiContent = content;
        } else {
          h.unshift(session);
        }
        localStorage.setItem("aetheris_history", JSON.stringify(h.slice(0, 10)));
        renderHistory();
      }

      window.startReading = async () => {
        const name = document.getElementById("username").value || "Someone";
        const question = document.getElementById("question").value;
        const count = parseInt(document.getElementById("numCards").value);
        if (!question) return alert("Vui lòng nhập câu hỏi!");

        savePreferences();
        const drawn = [...TAROT_DB]
          .sort(() => 0.5 - Math.random())
          .slice(0, count)
          .map((c) => ({ ...c, isRev: Math.random() > 0.7 }));
        const session = { id: Date.now(), name, question, cards: drawn };

        renderSession(session);
      };

      window.clearApiKey = () => {
        localStorage.removeItem("gemini_api_key");
        document.getElementById("apiKey").value = "";
        alert("Đã xóa Key!");
      };
      window.regenerateAI = () => {
        if (currentSessionData) {
          delete currentSessionData.aiContent;
          renderSession(currentSessionData);
        }
      };
      window.deleteSession = (e, id) => {
        e.stopPropagation();
        let h = JSON.parse(localStorage.getItem("aetheris_history") || "[]").filter((s) => s.id !== id);
        localStorage.setItem("aetheris_history", JSON.stringify(h));
        renderHistory();
      };
      window.replaySession = (id) => {
        const h = JSON.parse(localStorage.getItem("aetheris_history") || "[]").find((s) => s.id == id);
        if (h) renderSession(h);
      };

      function renderHistory() {
        const box = document.getElementById("historyBox");
        const list = document.getElementById("historyList");
        const h = JSON.parse(localStorage.getItem("aetheris_history") || "[]");
        if (h.length > 0) {
          box.classList.remove("hidden");
          list.innerHTML = h
            .map(
              (s) => `
            <div class="flex items-center bg-white/5 border border-white/5 rounded-full px-4 py-2 hover:bg-cyan-500/5 transition cursor-pointer" onclick="replaySession(${s.id})">
              <span class="text-[10px] text-slate-300 mr-2">${s.question.substring(0, 15)}...</span>
              <button onclick="deleteSession(event, ${s.id})" class="text-slate-500 hover:text-rose-500"><i class="fas fa-times text-[10px]"></i></button>
            </div>`
            )
            .join("");
        } else box.classList.add("hidden");
      }
    </script>
