    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: #020617;
        color: #f8fafc;
        min-height: 100vh;
      }

      /* Glassmorphism lướt mịn */
      .glass-panel {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .input-style {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }

      .input-style:focus {
        border-color: #22d3ee;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
      }

      /* Card 3D Flip */
      .card-container {
        perspective: 1500px;
      }
      .card-inner {
        transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        transform-style: preserve-3d;
      }
      .card-flipped {
        transform: rotateY(180deg);
      }
      .card-face {
        backface-visibility: hidden;
        position: absolute;
        inset: 0;
      }
      .card-back {
        transform: rotateY(180deg);
      }

      /* Animation xuất hiện */
      .fade-up {
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      /* Nút bấm hiệu ứng Gradient */
      .btn-gradient {
        background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
        transition: all 0.4s ease;
      }

      .btn-gradient:hover {
        box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
        transform: translateY(-2px);
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
    </style>
  </head>

        },
        {

          reversed: "Thiếu thịnh vượng, bỏ bê, vật chất quá mức",
        },

          reversed: "Tham lam, thiếu đạo đức, mất tài sản",
        },
      ];

      let historyAllowed = localStorage.getItem("aetheris_consent") === "true";

      window.onload = () => {
        if (localStorage.getItem("aetheris_consent") === null) {
          setTimeout(
            () =>
              document
                .getElementById("cookieNotice")
                .classList.replace("hidden", "flex"),
            1000,
          );
        }
        renderHistory();
      };

      function acceptCookies(val) {
        localStorage.setItem("aetheris_consent", val);
        historyAllowed = val;
        document
          .getElementById("cookieNotice")
          .classList.replace("flex", "hidden");
      }

      async function startReading() {
        const name = document.getElementById("username").value || "Someone";
        const question = document.getElementById("question").value;
        const count = parseInt(document.getElementById("numCards").value);

        if (!question) return alert("Vui lòng nhập câu hỏi.");

        const drawnCards = [...TAROT_DB]
          .sort(() => 0.5 - Math.random())
          .slice(0, count)
          .map((c) => ({
            ...c,
            isRev: Math.random() > 0.7,
          }));

        const sessionData = {
          id: Date.now(),
          name,
          question,
          cards: drawnCards,
        };
        if (historyAllowed) saveSession(sessionData);
        renderSession(sessionData);
      }

      function saveSession(data) {
        let history = JSON.parse(
          localStorage.getItem("aetheris_history") || "[]",
        );
        history.unshift(data);
        localStorage.setItem(
          "aetheris_history",
          JSON.stringify(history.slice(0, 8)),
        );
        renderHistory();
      }

      function renderHistory() {
        const box = document.getElementById("historyBox");
        const list = document.getElementById("historyList");
        const history = JSON.parse(
          localStorage.getItem("aetheris_history") || "[]",
        );
        if (history.length > 0) {
          box.classList.remove("hidden");
          list.innerHTML = history
            .map(
              (h) => `
                    <button onclick="replaySession(${h.id})" class="text-[10px] px-4 py-2 rounded-full bg-white/5 border border-white/5 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition">
                        ${h.question.substring(0, 15)}...
                    </button>
                `,
            )
            .join("");
        }
      }

      function replaySession(id) {
        const history = JSON.parse(
          localStorage.getItem("aetheris_history") || "[]",
        );
        const session = history.find((s) => s.id == id);
        if (session) renderSession(session);
      }

      async function renderSession(data) {
        const area = document.getElementById("readingArea");
        const grid = document.getElementById("cardsGrid");
        document.getElementById("displayUserName").innerText = data.name;
        document.getElementById("displayQuestion").innerText =
          `“${data.question}”`;
        area.classList.remove("hidden");
        grid.innerHTML = "";
        document.getElementById("promptOutput").classList.add("opacity-0");

        for (let i = 0; i < data.cards.length; i++) {
          const card = data.cards[i];
          const cardUI = document.createElement("div");
          cardUI.className = "card-container fade-up aspect-[2/3]";

          // Quyết định nội dung dựa trên trạng thái xuôi/ngược
          const cardStatus = card.isRev ? "NGƯỢC" : "XUÔI";
          const cardMeaning = card.isRev ? card.reversed : card.upright;
          const statusClass = card.isRev
            ? "text-rose-400 bg-rose-500/10"
            : "text-cyan-400 bg-cyan-500/10";

          cardUI.innerHTML = `
                    <div class="card-inner relative w-full h-full shadow-2xl rounded-[2rem] cursor-pointer">
                        <div class="card-face card-front glass-panel rounded-[2rem] flex items-center justify-center border-white/5">
                            <div class="w-14 h-14 rounded-full border border-cyan-500/20 flex items-center justify-center relative">
                                <div class="absolute inset-0 rounded-full bg-cyan-500/5 animate-ping"></div>
                                <div class="w-2.5 h-2.5 bg-cyan-500 rounded-full shadow-[0_0_15px_rgba(34,211,238,0.8)]"></div>
                            </div>
                        </div>

                        <div class="card-face card-back glass-panel rounded-[2rem] p-5 flex flex-col items-center justify-between border-cyan-500/40 relative overflow-hidden">
                            <div class="absolute -top-10 -right-10 w-20 h-20 bg-cyan-500/10 blur-2xl"></div>
                            
                            <div class="text-[9px] font-bold text-slate-500 tracking-[0.2em] uppercase">Arcana No.${i + 1}</div>
                            
                            <div class="text-center group">
                                <div class="text-lg font-bold text-white transition-transform duration-500 ${card.isRev ? "rotate-180" : "group-hover:scale-110"}">
                                    ${card.vi}
                                </div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-widest mt-1 font-light italic">
                                    ${card.en}
                                </div>
                            </div>

                            <div class="w-full space-y-3 text-center">
                                <div class="inline-block px-3 py-1 rounded-full text-[9px] font-bold tracking-tighter ${statusClass}">
                                    ${cardStatus}
                                </div>
                                <p class="text-[11px] text-slate-300 leading-relaxed font-medium px-2">
                                    ${cardMeaning}
                                </p>
                            </div>
                            
                            <div class="w-10 h-1 bg-gradient-to-r from-transparent via-slate-700 to-transparent"></div>
                        </div>
                    </div>
                `;

          grid.appendChild(cardUI);

          // Tạo độ trễ lật bài mượt mà
          await new Promise((r) => setTimeout(r, 250));
          cardUI.querySelector(".card-inner").classList.add("card-flipped");
        }

        const cardsList = data.cards
          .map((c) => `${c.en} (${c.isRev ? "Ngược" : "Xuôi"})`)
          .join(", ");

        const prompt = `Đóng vai Tarot chuyên nghiệp, giải mã phiên của: ${data.name}
            Câu hỏi: "${data.question}"
            Các lá bài đã rút: ${cardsList}

            YÊU CẦU PHÂN TÍCH:

            1. Đóng vai một Tarot Reader chuyên nghiệp
            2. Phân tích CHI TIẾT từng lá bài:
               - Ý nghĩa cơ bản của lá bài (cả xuôi/ngược)
               - Ý nghĩa của lá bài trong ngữ cảnh câu hỏi cụ thể
               - Mối liên hệ giữa lá bài với tình huống được hỏi

            3. Phân tích tổng thể:
               - Mối quan hệ giữa các lá bài với nhau
               - Câu chuyện tổng thể mà bộ bài kể ra
               - Thông điệp chính từ bộ bài

            4. Đưa ra kết luận:
               - Dựa HOÀN TOÀN vào ý nghĩa của các lá bài
               - Không thêm thắt, không vẽ chuyện
               - Trung thực, khách quan
               - Cụ thể và chi tiết
               - Kết nối trực tiếp với câu hỏi ban đầu

            LƯU Ý QUAN TRỌNG:
            - Chỉ phân tích dựa trên các lá bài đã rút và câu hỏi
            - Không thêm thông tin ngoài hay suy diễn cá nhân
            - Giữ tính chính xác và trung thực của Tarot
            - Đưa ra cái nhìn sâu sắc nhưng không tiên đoán tương lai tuyệt đối
            - Tập trung vào hướng dẫn, bài học và nhận thức`;

        document.getElementById("promptText").innerText = prompt;
        setTimeout(() => {
          document
            .getElementById("promptOutput")
            .classList.replace("opacity-0", "opacity-100");
          window.scrollTo({ top: area.offsetTop - 50, behavior: "smooth" });
        }, 600);
      }

      function copyPrompt() {
        navigator.clipboard.writeText(
          document.getElementById("promptText").innerText,
        );
        alert("Đã chép Prompt!");
      }
    </script>
