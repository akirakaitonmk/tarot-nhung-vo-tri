<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetheris • Modern Tarot</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="overflow-x-hidden">
    <div class="max-w-6xl mx-auto px-6 py-12">
        <header class="text-center mb-16">
            <h1 class="text-xs tracking-[0.6em] text-cyan-500 font-bold mb-4 uppercase">Aetheris • Oracle</h1>
            <h2 class="text-4xl md:text-5xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-500">Khám phá bản ngã.</h2>
        </header>
        
        <div class="max-w-xl mx-auto space-y-12">
            <section class="glass-panel p-8 md:p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 blur-[60px]"></div>
                <div class="space-y-6 relative z-10">
                    <div class="space-y-4">
                        <input type="text" id="username" class="input-style w-full rounded-2xl px-5 py-4 outline-none text-sm" placeholder="Tên của bạn..." />
                        <div class="grid grid-cols-2 gap-4">
                            <select id="numCards" class="input-style w-full rounded-2xl px-5 py-4 outline-none text-sm cursor-pointer card-hover-effect">
                                <option value="1">1 Lá bài</option>
                                <option value="3" selected>3 Lá bài</option>
                                <option value="5">5 Lá bài</option>
                            </select>
                            <div class="flex items-center justify-center text-[10px] text-slate-500 uppercase tracking-widest font-bold border border-white/5 rounded-2xl card-hover-effect">Spread Mode</div>
                        </div>
                        <textarea id="question" rows="3" class="input-style w-full rounded-2xl px-5 py-4 outline-none text-sm resize-none card-hover-effect" placeholder="Viết câu hỏi của bạn..."></textarea>
                        <div class="space-y-3">
                            <div class="flex gap-2">
                                <input type="password" id="apiKey" class="input-style flex-1 rounded-xl px-4 py-2 text-[10px] outline-none card-hover-effect" placeholder="Nhập Gemini API Key..." />
                                <button onclick="clearApiKey()" class="text-[9px] text-rose-500/50 hover:text-rose-500 font-bold uppercase btn-press">Xóa Key</button>
                            </div>
                            <div class="flex items-center gap-2">
                                <select id="modelSelect" class="input-style flex-1 rounded-xl px-4 py-2 text-[10px] outline-none cursor-pointer text-cyan-400 font-bold card-hover-effect">
                                    <option value="gemini-3-flash-preview" selected>Gemini 3 Flash (Fast & Stable)</option>
                                    <option value="gemini-3-pro-preview">Gemini 3.0 Pro (Most Powerful)</option>
                                </select>
                                <div class="text-[9px] text-slate-500 font-bold uppercase">Model</div>
                            </div>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="saveConfig()" class="btn-gradient flex-1 py-3 rounded-xl font-bold text-xs tracking-widest uppercase btn-press">Lưu Cấu Hình</button>
                            <button onclick="clearConfig()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 flex-1 py-3 rounded-xl font-bold text-xs tracking-widest uppercase transition btn-press">Xóa Cấu Hình</button>
                        </div>
                    </div>
                    <button onclick="startReading()" class="btn-gradient w-full py-5 rounded-2xl font-bold text-sm tracking-widest uppercase shadow-lg btn-press">Bắt đầu trải bài</button>
                </div>
            </section>
            
            <div id="historyBox" class="hidden text-center space-y-4">
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-[0.3em]">Recent Sessions</span>
                <div id="historyList" class="flex flex-wrap justify-center gap-2"></div>
            </div>
        </div>
        
        <section id="readingArea" class="mt-24 hidden space-y-16">
            <div id="sessionHeader" class="max-w-2xl mx-auto text-center space-y-4 fade-in">
                <div class="inline-block px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-500/10">
                    <span id="displayUserName" class="text-cyan-400 text-xs font-bold uppercase tracking-widest"></span>
                </div>
                <h3 id="displayQuestion" class="text-xl md:text-2xl font-light italic text-slate-200 leading-relaxed text-blur-in"></h3>
            </div>
            
            <div id="cardsGrid" class="flex flex-wrap justify-center gap-8 w-full transition-all duration-700"></div>
            
            <div id="aiResponseArea" class="max-w-3xl mx-auto glass-panel p-8 md:p-12 rounded-[3rem] opacity-0 transition-all duration-1000 border-cyan-500/20 hidden">
                <div class="flex items-center justify-between mb-8 border-b border-white/5 pb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_10px_#22d3ee]"></div>
                        <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Aetheris AI Oracle</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="regenerateAI()" title="Luận giải lại" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400 hover:text-cyan-400 transition card-hover-effect btn-press">
                            <i class="fas fa-redo-alt text-xs"></i>
                        </button>
                        <button onclick="copyResponse()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400 hover:text-white transition card-hover-effect btn-press">
                            <i class="fas fa-copy text-xs"></i>
                        </button>
                    </div>
                </div>
                <div id="aiMarkdownOutput" class="text-slate-300 leading-relaxed font-light text-sm md:text-base"></div>
            </div>
        </section>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
